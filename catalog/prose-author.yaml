schema: gestalt-catalog/1
id: prose-author
ref: plugin:prose-author
kind: plugin
title: prose-author (vonnegut)
summary: Drafts in a person's voice from a revisioned voice profile; style tuning from feedback.
version_seen: 0.9.0
source: https://github.com/ConnorBritain/vonnegut/tree/main/bundles/prose-author
install:
  claude: "/plugin marketplace add ConnorBritain/vonnegut && /plugin install prose-author@vonnegut"
  codex: "node install-prose-codex.mjs"
steps:
  - id: prose-author.draft
    stage: make
    kind: author
    mode: dispatcher
    invoke: prose-draft, drafting against the active voice profile
  - id: prose-author.style-tune
    stage: reflect
    kind: ritual
    mode: explicit
    invoke: prose-style-tune, turning accepted edits into profile changes
harness: { claude: partial, codex: advisory, cursor: partial, agents-md: advisory }
cost: { skills: 4, agents: 4, commands: 0, listing_tokens: 741, session_start_lines: 0, measured_from: vonnegut@402bb35 }
worker: { tier: worker, mechanism: headless }
notes: Voice registry at ~/.config/prose-author (PROSE_IDENTITY_DIR), shared across harnesses.
