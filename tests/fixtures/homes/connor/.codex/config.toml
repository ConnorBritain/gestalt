model = "SECRET_MODEL_NAME"

[mcp_servers.linear]
command = "npx"
args = ["-y", "linear-mcp"]
env = { LINEAR_API_KEY = "lin_api_SECRET_CODEX" }

[mcp_servers."docs.search"]
