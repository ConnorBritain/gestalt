# Planted defect for GST-PROFILE: a profile that loads a primitive the base way does not.
# Generated from ways/minimal.way.yaml; lint must report exactly this code.
schema: gestalt-way/1
person:
  name: Test Person
  roles: [developer]
  goals:
    - { id: ship, text: Ship the change with tests that still mean something. }
harnesses: [claude]
writer: manual
connectors:
  - { id: github, ref: mcp:github, role: code }
contexts:
  everywhere: { when: always }
  code: { when: "file-exists:package.json" }
flow:
  check:
    - { use: verification-gate.gates, in: [code] }
    - { use: verification-gate.critics, in: [code], after: [verification-gate.gates] }
stop_order: [verification-gate.gates]
taste:
  - { id: fix, prompt: "Fix the failing test in src/sum.js without touching the test.", context: code, path: [make, check] }
  - { id: question, prompt: "What does this repo do? Two lines.", context: everywhere, path: [], expect_quiet: [verification-gate.critics] }
  - { id: refactor, prompt: "Rename sum to add everywhere.", context: code, path: [make, check] }
profiles:
  full:
    description: Adds cairn's weekly review, which no base step loads.
    reflect:
      weekly: [cairn.review]
